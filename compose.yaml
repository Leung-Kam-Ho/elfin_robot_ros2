services:
  elfin5:
    build:
      context: .
      dockerfile: Dockerfile
    image: elfin5-ros2:foxy
    container_name: elfin5-ros2
    # Defaults to the host architecture (the upstream base image ships amd64 and
    # arm64 variants). Set DOCKER_PLATFORM, e.g. linux/amd64, to force a platform.
    platform: ${DOCKER_PLATFORM:-}
    ports:
      - "127.0.0.1:6080:80"
    shm_size: 1gb
    environment:
      PASSWORD: ${VNC_PASSWORD:-ubuntu}
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      ELFIN_TCP_AUTOSTART: "${ELFIN_TCP_AUTOSTART:-false}"
      ELFIN_TCP_ROBOT_IP: "${ELFIN_TCP_ROBOT_IP:-192.168.1.63}"
      ELFIN_TCP_ROBOT_PORT: "${ELFIN_TCP_ROBOT_PORT:-10003}"
      ELFIN_TCP_ALLOW_MOTION: "${ELFIN_TCP_ALLOW_MOTION:-false}"
      ELFIN_TCP_ALLOW_GRIPPER: "${ELFIN_TCP_ALLOW_GRIPPER:-false}"
    volumes:
      - .:/opt/elfin_ws/src/elfin_robot_ros2:ro
    restart: unless-stopped
