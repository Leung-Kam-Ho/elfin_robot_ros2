services:
  elfin5:
    build:
      context: .
      dockerfile: Dockerfile
    image: elfin5-ros2:foxy
    container_name: elfin5-ros2
    # Defaults to the host architecture (the upstream base image ships amd64 and
    # arm64 variants). Set DOCKER_PLATFORM, e.g. linux/amd64, to force a platform.
    platform: ${DOCKER_PLATFORM:-}
    ports:
      - "127.0.0.1:6080:80"
    shm_size: 1gb
    environment:
      PASSWORD: ${VNC_PASSWORD:-ubuntu}
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
    volumes:
      - ./elfin_robot_bringup/config:/opt/elfin_ws/install/share/elfin_robot_bringup/config:ro
    restart: unless-stopped
