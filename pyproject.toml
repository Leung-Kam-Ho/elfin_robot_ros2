[project]
name = "elfin-robot"
version = "0.1.0"
description = "uv project for the Elfin robot's Python tooling"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "httpx>=0.27,<1",
    "flask>=3.0,<4",
]

[project.scripts]
elfin = "elfin_dev_tools.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["elfin_dev_tools/src/elfin_dev_tools"]

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
]

[tool.pytest.ini_options]
testpaths = ["elfin_dev_tools/tests"]
