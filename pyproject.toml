[project]
name = "elfin-tools"
version = "0.1.0"
description = "Host-side CLI tools for the Elfin robot (no ROS required)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27,<1",
]

[project.scripts]
elfin = "elfin_dev_tools.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["elfin_dev_tools/src/elfin_tools"]

[tool.pytest.ini_options]
testpaths = ["elfin_dev_tools/tests"]
